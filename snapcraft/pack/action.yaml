name: 'Build a snap'
description: 'Pack a snap with Snapcraft'
author: 'Canonical'

inputs:
  path:
    description: >
      The location of the Snapcraft project.

      Defaults to the root of the repository.
    default: '.'
  verbosity:
    description: >
      The build verbosity level, which can be set to "quiet", "brief",
      "verbose", "debug", or "trace".

      The default is "trace".
    default: 'trace'
  channel:
    description: >
      The channel to install Snapcraft from.

      Defaults to the latest stable release.
    default: 'latest/stable'
  revision:
    description: >
      The revision of Snapcraft to install.

      Defaults to the latest stable revision.

      Overrides the `channel` option.
    default: ''
  lxd-channel:
    description: >
      The channel to install LXD from.

      Defaults to the recommended channel for Snapcraft.
    default: '5.21/stable'
  test:
    description: >
      Run `snapcraft test` after packaging.

      Defaults to false.
    default: 'false'

outputs:
  snaps:
    description: The packed snap artifacts, space-separated.
  components:
    description: The packed components, space-separated.
  lxd-revision:
    description: The LXD revision used.
  snapcraft-revision:
    description: The Snapcraft revision used.

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: package
  color: orange
