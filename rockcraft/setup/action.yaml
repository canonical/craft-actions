name: 'Set up Rockcraft'
description: 'Install Rockcraft'
author: 'Canonical'
inputs:
  channel:
    description: >
      The channel to install Rockcraft from.

      Defaults to the latest stable release.
    default: 'latest/stable'
  revision:
    description: >
      The revision of Rockcraft to install.

      Defaults to the latest stable revision.

      Overrides the `channel` option.
    default: ''
  lxd-channel:
    description: >
      The channel to install LXD from.

      Defaults to the recommended channel for Rockcraft.
    default: '5.21/stable'

outputs:
  lxd-revision:
    description: The LXD revision used.
  rockcraft-revision:
    description: The Rockcraft revision used.

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: layers
  color: orange
