name: 'Build a charm'
description: 'Pack a charm with Charmcraft'
author: 'Canonical'

inputs:
  path:
    description: >
      The location of the Charmcraft project.

      Defaults to the root of the repository.
    default: '.'
  verbosity:
    description: >
      The build verbosity level, which can be set to "quiet", "brief",
      "verbose", "debug", or "trace".

      The default is "trace".
    default: 'trace'
  channel:
    description: >
      The channel to install Charmcraft from.

      If empty, the default channel for Charmcraft is used.
    default: ''
  revision:
    description: >
      The revision of Charmcraft to install.

      Defaults to the latest stable revision.

      Overrides the `channel` option.
    default: ''
  lxd-channel:
    description: >
      The channel to install LXD from.

      If empty, snapd's default channel for LXD is used.
    default: ''
  test:
    description: >
      Run `charmcraft test` after packaging.

      Defaults to false.
    default: 'false'

outputs:
  charms:
    description: The packed charm artifacts, space-separated.
  lxd-revision:
    description: The LXD revision used.
  charmcraft-revision:
    description: The Charmcraft revision used.

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: layers
  color: orange
