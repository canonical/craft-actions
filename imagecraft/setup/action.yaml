name: 'Set up Imagecraft'
description: 'Install Imagecraft'
author: 'Canonical'
inputs:
  channel:
    description: >
      The channel to install Imagecraft from.

      If empty, the default channel for Imagecraft is used.
    default: ''
  revision:
    description: >
      The revision of Imagecraft to install.

      Overrides the `channel` option.
    default: ''
  lxd-channel:
    description: >
      The channel to install LXD from.

      If empty, snapd's default channel for LXD is used.
    default: ''

outputs:
  lxd-revision:
    description: The LXD revision used.
  imagecraft-revision:
    description: The Imagecraft revision used.

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: package
  color: orange
