name: Test the actions

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"

jobs:
  test-action-code:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install
    - name: Check the formatting
      run: pnpm format-check
    - name: Lint the code
      run: pnpm lint
    - name: Run the unit tests
      run: pnpm test
    - name: Try to package code
      run: pnpm build
    - name: Ensure packaged code is committed
      run: git diff --exit-code

  run-rockcraft-pack-action:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        revision: ['1206', '']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build a rock
      uses: ./rockcraft-pack
      id: rockcraft
      with:
        path: tests
        verbosity: debug
        revision: ${{ matrix.revision }}
    - name: Assert revision number
      if: matrix.revision != ''
      run: |
        set -ex
        installed_rev="$(snap info rockcraft | tail -1 | awk '{print $(NF-2)}')"
        [ "$installed_rev" == "(${{ matrix.revision }})" ]
    - name: Upload rock
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-rock-${{ matrix.os }}-${{ matrix.revision }}
        path: ${{ steps.rockcraft.outputs.rock }}

  run-rockcraft-pack-action-legacy-rock:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build a legacy rock
        uses: ./rockcraft-pack
        id: rockcraft
        with:
          path: tests/legacy
          verbosity: debug
          ignore: 'unmaintained'
      - name: Upload legacy rock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-legacy-rock-${{ matrix.os }}
          path: ${{ steps.rockcraft.outputs.rock }}
