name: 'Set up Imagecraft'
description: 'Install Imagecraft'
author: 'Canonical'
inputs:
  channel:
    description: >
      The channel to install Imagecraft from.

      Defaults to the latest beta release.

      This option will default to the latest stable release once one is
      available.
    default: 'latest/beta'
  revision:
    description: >
      The revision of Imagecraft to install.

      Defaults to the latest stable revision.

      Overrides the `channel` option.
    default: ''
  lxd-channel:
    description: >
      The channel to install LXD from.

      Defaults to the recommended channel for Imagecraft.
    default: '5.21/stable'

outputs:
  lxd-revision:
    description: The LXD revision used.
  imagecraft-revision:
    description: The Imagecraft revision used.

runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: package
  color: orange
